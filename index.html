<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loopling</title>
<meta name="description" content="Loopling - tiny stories that loop forever. Seamlessly looping animations made entirely with code.">
<style>
  :root { --bg:#0e0e11; --fg:#eceef2; --muted:#9a9eaa; --accent:#00c4a0; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:640px; margin:0 auto; padding:56px 16px; text-align:center; }
  img { width:180px; height:180px; border-radius:50%; }
  h1 { font-size:44px; margin:16px 0 4px; }
  p { color:var(--muted); }
  a { color:var(--accent); }
  nav { margin-top:32px; display:flex; gap:20px; justify-content:center; flex-wrap:wrap; }
  footer { margin-top:48px; font-size:14px; color:var(--muted); }
</style>
</head>
<body>
<main>
  <img src="logo.png" alt="Loopling logo: a teal dot completing a ring of dots">
  <h1>Loopling</h1>
  <p>Tiny stories that loop forever. Every video is a small story &mdash; someone tries, fails, tries again, and finally makes it &mdash; then it quietly starts over. Every frame and every sound is made with code.</p>
  <nav>
    <a href="https://www.youtube.com/@Loopling_Official">YouTube</a>
    <a href="https://www.instagram.com/loopling_official/">Instagram</a>
    <a href="privacy.html">Privacy policy</a>
  </nav>
  <footer>Contact: <a href="mailto:ezra.behr@gmail.com">ezra.behr@gmail.com</a></footer>
</main>
</body>
</html>
